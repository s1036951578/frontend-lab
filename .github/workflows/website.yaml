name: website

on:
  push:
    paths:
      - "apps/website/**"
      - "packages/**" # 如果改了公共包也需要重新构建，建议加上
      - "pnpm-lock.yaml"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: "pnpm" # 开启 pnpm 缓存，加快安装速度

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        run: pnpm --filter website build
