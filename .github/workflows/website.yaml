name:
website

on:

 push:

  paths:

   - apps/website/**


jobs:


build:


 runs-on:
 ubuntu-latest



 steps:


 - uses:
    actions/checkout@v4



 - name:
    setup pnpm

   uses:
    pnpm/action-setup@v4



 - name:
    node

   uses:
    actions/setup-node@v4

   with:

    node-version:22



 - name:
    install

   run:

    pnpm install



 - name:
    build

   run:

    pnpm --filter website build
